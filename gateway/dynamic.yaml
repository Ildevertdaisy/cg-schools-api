http:
  routers:
  # Declaring routes
    schools-api-router:
      entryPoints:
        - websecure
      rule: "Host(`api.ildevert.com`)"
      service: schools-api-service
      tls: 
        certResolver: "letsencrypt-staging"
  # Declaring services
  services:
    schools-api-service:
      loadBalancer:
        servers:
          - url: http://schools-service:8001/

