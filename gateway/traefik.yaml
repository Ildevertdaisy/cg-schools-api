
api:
  insecure: true
log:
  level: INFO
providers:
  docker:
    watch: true
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yaml
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
certificatesResolvers:
    acme:
    email: "ildevertdaisy@gmail.com"
    storage: "acme-staging.json"
    # CA server to use.
    caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
    tlsChallenge: {}
    
  # minioweb:
  #   address: ":7777"
